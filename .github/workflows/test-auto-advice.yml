name: Verify automatic advice
on:
  push:
    branches: [main, auto-advice-work]
    paths: ['src/**', 'tests/**', 'build.py', '.github/workflows/test-auto-advice.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto-advice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser verification environment
        run: |
          python3 -m venv /tmp/testflow-browser
          /tmp/testflow-browser/bin/pip install playwright==1.57.0
          /tmp/testflow-browser/bin/python -m playwright install --with-deps chromium
      - name: Verify original functionality and automatic advice
        env:
          TESTFLOW_REAL_STORAGE: '1'
          TESTFLOW_SCREENSHOTS: test-results/auto-advice
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          commands=[['npm','test'],['node','tests/optimizer.cjs'],['node','tests/unified-optimizer.cjs'],['node','tests/auto-advice.cjs'],['python3','build.py'],['/tmp/testflow-browser/bin/python','tests/unified-browser.py']]
          if Path('tests/auto-advice-browser.py').exists():commands.append(['/tmp/testflow-browser/bin/python','tests/auto-advice-browser.py'])
          if os.environ['GITHUB_REF_NAME']=='main':commands.append(['git','diff','--exit-code','--','index.html'])
          report={'sourceCommit':os.environ['GITHUB_SHA'],'runUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'checks':[]}
          for command in commands:
              try:
                  p=subprocess.run(command,capture_output=True,text=True,timeout=360)
                  item={'command':' '.join(command),'exitCode':p.returncode,'stdout':p.stdout[-24000:],'stderr':p.stderr[-12000:]}
              except Exception as error:item={'command':' '.join(command),'exitCode':1,'stdout':'','stderr':str(error)}
              report['checks'].append(item);print(item['command'],item['exitCode']);print(item['stdout']);print(item['stderr'])
          report['passed']=all(item['exitCode']==0 for item in report['checks'])
          report['autoBrowserPresent']=Path('tests/auto-advice-browser.py').exists()
          report['sha256']={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in [*sorted(Path('src').glob('*')),*sorted(Path('tests').glob('*')),Path('build.py'),Path('index.html')] if p.is_file()}
          Path('docs/auto-advice-verification.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          raise SystemExit(0 if report['passed'] else 1)
          PY
      - name: Save verification evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-advice-verification
          path: |
            docs/auto-advice-verification.json
            test-results/
            index.html
          retention-days: 14
      - name: Save work-branch evidence and verified build
        if: always() && github.ref_name == 'auto-advice-work'
        run: |
          if [ ! -f docs/auto-advice-verification.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/auto-advice-verification.json
          if python3 -c "import json;r=json.load(open('docs/auto-advice-verification.json'));assert r['passed'] and r['autoBrowserPresent']"; then git add index.html; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '记录自动建议验证与已验证构建'
          git push origin HEAD:auto-advice-work
