name: Verify published page
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/verify-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-published-page
  cancel-in-progress: true
jobs:
  verify-public-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify live GitHub Pages HTML equals the committed release
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          expected=hashlib.sha256(Path('index.html').read_bytes()).hexdigest()
          url='https://zekeniu.github.io/testflow-scheduler/?verify='+os.environ['GITHUB_SHA']
          result={'commit':os.environ['GITHUB_SHA'],'url':url,'expectedSHA256':expected,'matched':False}
          for attempt in range(36):
              try:
                  request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'TestFlow-release-verification'})
                  with urllib.request.urlopen(request,timeout=15) as response:
                      body=response.read()
                  actual=hashlib.sha256(body).hexdigest()
                  result.update(actualSHA256=actual,bytes=len(body),attempt=attempt+1)
                  if actual==expected:
                      result['matched']=True
                      print('Published page matches the committed release:',expected,flush=True)
                      break
                  print('Pages is not serving this release yet; retrying.',flush=True)
              except Exception as error:
                  result['lastError']=str(error)
                  print('Publication check pending:',error,flush=True)
              time.sleep(5)
          Path('published-page-verification.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if not result['matched']:
              raise SystemExit('Could not verify the published page against this release within the check window.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
              summary.write('Public GitHub Pages HTML matches commit `'+result['commit']+'` byte for byte.\n\nSHA-256: `'+expected+'`\n')
          PY
      - name: Save public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-page-verification
          path: published-page-verification.json
          retention-days: 14
